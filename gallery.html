      --paypal: #0070ba; --paypal-dark: #003087;

      --header-bg: rgba(244, 241, 234, 0.9); --border: #e2dacb;

    :root[data-theme="dark"] {
      --bg: #1c1a17; --surface: #26231f; --ink: #ece6dc; --muted: #a59c90;
      --accent: #d4a14e; --accent-dark: #b9863a;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      --header-bg: rgba(28, 26, 23, 0.9); --border: #3a352f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Georgia", "Times New Roman", serif;
      background: var(--bg); color: var(--ink); line-height: 1.6;
      transition: background 0.3s ease, color 0.3s ease;
    }
    .lang-switch {
      position: sticky; top: 0; z-index: 10; display: flex; align-items: center;
      justify-content: flex-end; gap: 0.6rem; padding: 0.6rem 1.5rem;
      background: var(--header-bg); backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border);
      transition: background 0.3s ease, border-color 0.3s ease;
    }
    .lang-switch select {
      font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.85rem;
      font-weight: bold; padding: 0.35rem 0.8rem; border: 1px solid var(--accent);
      background: var(--surface); color: var(--accent-dark);
      border-radius: 999px; cursor: pointer;
    }
    .theme-toggle {
      display: inline-flex; align-items: center; justify-content: center;
      width: 2.2rem; height: 2.2rem; padding: 0; border: 1px solid var(--accent);
      background: transparent; color: var(--accent-dark); border-radius: 999px;
      cursor: pointer; transition: background 0.2s ease, color 0.2s ease;
    }
    .theme-toggle:hover { background: var(--accent); color: #fff; }
    .theme-toggle svg { width: 1.1rem; height: 1.1rem; }

    :root[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
    :root[data-theme="dark"] .theme-toggle .icon-moon { display: block; }
    header { text-align: center; padding: 3.5rem 1.5rem 3rem;
      background: linear-gradient(180deg, var(--surface), var(--bg));
      border-bottom: 1px solid var(--border); }

    main { max-width: 1140px; margin: 0 auto; padding: 3rem 1.5rem; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
    figure { margin: 0; display: flex; flex-direction: column; background: var(--surface);
      border-radius: 6px; overflow: hidden; box-shadow: var(--shadow);
      transition: transform 0.25s ease, box-shadow 0.25s ease; }
    figure:hover, figure:focus-within { transform: translateY(-6px); box-shadow: 0 14px 32px rgba(43, 38, 34, 0.2); }
    figure img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #ddd; }
    figcaption { display: flex; flex-direction: column; flex: 1; padding: 1rem 1.25rem 1.5rem; }
    .cat-badge { align-self: flex-start; font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.7rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--accent-dark); border: 1px solid var(--accent); border-radius: 999px;
      padding: 0.1rem 0.6rem; margin: 0 0 0.5rem; }
    figcaption .title { font-size: 1.2rem; font-weight: bold; margin: 0 0 0.25rem; }
    figcaption .meta { color: var(--muted); font-size: 0.9rem; font-style: italic; margin: 0 0 0.35rem; }
    figcaption .style { color: var(--ink); font-size: 0.9rem; margin: 0 0 0.35rem; }
    figcaption .note { color: var(--muted); font-size: 0.85rem; margin: 0 0 1rem; }
    .actions { margin-top: auto; display: flex; flex-direction: column; gap: 0.5rem; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 0.6rem 1rem; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 0.9rem;
      font-weight: bold; text-decoration: none; border: none; border-radius: 6px; cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease; }
    .btn:active { transform: scale(0.98); }
    .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .donate { margin: 4rem auto 0; max-width: 560px; text-align: center; background: var(--surface);
      border: 1px solid var(--border); border-radius: 8px; padding: 2.5rem 2rem; box-shadow: var(--shadow); }
    .donate h2 { margin-top: 0; }
    .donate p { color: var(--muted); }
    .paypal-btn { display: inline-flex; align-items: center; gap: 0.6rem; margin-top: 1rem;

    footer { text-align: center; padding: 2.5rem 1.5rem; color: var(--muted); font-size: 0.85rem; }

    // Kontakt-E-Mail-Adresse hier anpassen:
    const CONTACT_EMAIL = "piegsa@gmail.com";

    const gallery = document.getElementById("gallery");
    const langSelect = document.getElementById("langSelect");

    LANGS.forEach(l => {
      const opt = document.createElement("option");
      opt.value = l.code; opt.textContent = l.name;
      langSelect.appendChild(opt);
    });

    function pick(field, lang) {
      return (field && field[lang] !== undefined && field[lang] !== "") ? field[lang] : "";
    }

    function render(lang) {
      const ui = UI[lang];
      const dir = (LANGS.find(l => l.code === lang) || {}).dir || "ltr";
      document.documentElement.lang = lang;
      document.documentElement.dir = dir;

      document.getElementById("subtitle").textContent = ui.subtitle;
      document.getElementById("donateTitle").textContent = ui.donateTitle;
      document.getElementById("donateText").textContent = ui.donateText;
      document.getElementById("donateBtnText").textContent = ui.donateBtn;
      document.getElementById("footer").textContent = ui.footer;

      gallery.innerHTML = "";
      WORKS.forEach(w => {
        const fig = document.createElement("figure");

        const img = document.createElement("img");
        img.src = "images/" + w.file;
        img.alt = w.title;
        img.loading = "lazy";
        fig.appendChild(img);

        const cap = document.createElement("figcaption");

        const cat = pick(w.category, lang);
        if (cat) {
          const badge = document.createElement("span");
          badge.className = "cat-badge";
          badge.textContent = cat;
          cap.appendChild(badge);
        }

        const title = document.createElement("p");
        title.className = "title";
        title.textContent = w.title;
        cap.appendChild(title);

        const metaParts = [pick(w.material, lang), pick(w.size, lang)];
        if (w.year) metaParts.push(w.year);
        const meta = document.createElement("p");
        meta.className = "meta";
        meta.textContent = metaParts.filter(Boolean).join(" · ");
        cap.appendChild(meta);

        const style = pick(w.style, lang);
        if (style) {
          const st = document.createElement("p");
          st.className = "style";
          st.textContent = style;
          cap.appendChild(st);
        }

        const note = pick(w.note, lang);
        if (note) {
          const nt = document.createElement("p");
          nt.className = "note";
          nt.textContent = note;
          cap.appendChild(nt);
        }

        const actions = document.createElement("div");
        actions.className = "actions";
        const contact = document.createElement("a");
        contact.className = "btn btn-ghost";
        contact.href = "mailto:" + CONTACT_EMAIL +
          "?subject=" + encodeURIComponent(ui.inquiry + ": " + w.title);
        contact.textContent = ui.contact;
        actions.appendChild(contact);
        cap.appendChild(actions);

        fig.appendChild(cap);
        gallery.appendChild(fig);
      });
    }

    langSelect.addEventListener("change", () => render(langSelect.value));

    function setTheme(theme) { document.documentElement.setAttribute("data-theme", theme); }
    document.getElementById("themeToggle").addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
      setTheme(current === "dark" ? "light" : "dark");
    });

    langSelect.value = "de";
    render("de");
  </script>
